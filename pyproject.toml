[project]
name = "coordinate-transformation-api"
description = "Coordinate Transformation API of the Nederlandse Samenwerking Geodetische Infrastructuur (NSGI)"
keywords = ["NSGI", "pyproj", "fastapi", "coordinates", "geo"]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.15",
]
readme = { file = "./README.md", content-type = "text/markdown" }
dependencies = [
    "fastapi[all]==0.162.0",
    "uvicorn==0.54.0",
    "pyyaml == 6.0.3",
    "geojson-pydantic>=2,<3",
    "pyproj @ https://github.com/GeodetischeInfrastructuur/transformations/releases/download/2.2.0-build1-proj9.7.1/pyproj-3.7.2+nsgi2.2.0.build1-cp315-cp315-manylinux_2_28_x86_64.whl",
    "pydantic-settings==2.16.2",
    "email-validator == 2.3.0",
    "geodense @ https://github.com/GeodetischeInfrastructuur/geodense/releases/download/3.0.1/geodense-3.0.1-py3-none-any.whl",
    "shapely == 2.2.0",
    "python-json-logger >=4.2.0",
    "orjson == 3.13.0",
    "numpy == 2.5.4",
]
requires-python = ">=3.15"
dynamic = ["version"]

[dependency-groups]
dev= [
    "prek>=0.5.9",
    "ruff>=0.17.3",
    "yamllint>=1.35.1",
    "coverage==7.17.0",
    "ty>=0.0.95",
    "pytest==9.2.0",
    "types-ujson == 5.10.0.20250822",
    "types-PyYAML == 6.0.12.20260518",
    "pytest-asyncio==1.4.1.post1",
    "types-shapely>=2.1.0.20261030",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
ct-api = "coordinate_transformation_api.main:main"

[tool.hatch.version]
source = "vcs"


[tool.ruff]
preview = true

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "build",
]

line-length = 120

# Allow unused variables when underscore-prefixed.
target-version = "py315"

[tool.ruff.lint]
explicit-preview-rules = true

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

select = [
    "E",
    "F",
    "B",
    "ISC",
    "PL",
    "RUF",
    "PT",
    "N",
    "I",
    "C90",
    "W",
    "UP",
    "S",
    "ARG",
    "SIM",
    "Q",
    "ANN",
]
# Avoid enforcing line-length violations (`E501`) - fixed by Black
ignore = ["E501"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = [
    "E",
    "F",
    "B",
    "ISC",
    "PL",
    "RUF",
    "PT",
    "N",
    "I",
    "C90",
    "W",
    "UP",
    "S",
    "ARG",
    "SIM",
    "Q",
]
unfixable = []

# disable rules for tests
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # asserts allowed
    "ANN",  # no type annotation required
]
"src/coordinate_transformation_api/cityjson/models.py" = [
    "N815", # non-snakecase variables allowed
]
"src/coordinate_transformation_api/models.py" = [
    "ANN102",  # cls parameter type annotation not required
]
"src/coordinate_transformation_api/util.py" = ["ANN"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ty.src]
exclude = ["tests"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
required-version = '>=0.13.6'
cache-keys = [{ file = "pyproject.toml" }, { git = true }]
# exclude-newer = '8 days'
exclude-newer-package = { certifi = false }
